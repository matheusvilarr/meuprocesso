<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Meu Processo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div id="admin-guard" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#6b6b63;">
    Verificando acesso…
  </div>

  <div id="admin-app" style="display:none;">
    <header class="adm-header">
      <div class="adm-header-left">
        <span class="adm-logo">Meu Processo</span>
        <span class="adm-badge">ADMIN</span>
      </div>
      <a href="dashboard.html" class="adm-voltar"><i class="ti ti-arrow-left"></i> Voltar ao dashboard</a>
    </header>

    <main class="adm-main">

      <nav class="adm-tabs">
        <button class="adm-tab active" data-tab="advogados"><i class="ti ti-users"></i> Advogados</button>
        <button class="adm-tab" data-tab="codigos"><i class="ti ti-ticket"></i> Códigos de convite</button>
        <button class="adm-tab" data-tab="admins"><i class="ti ti-shield-lock"></i> Administradores</button>
      </nav>

      <!-- ADVOGADOS -->
      <section id="tab-advogados" class="adm-panel">
        <div class="adm-panel-header">
          <h2>Advogados cadastrados</h2>
          <span id="adv-total" class="adm-count"></span>
        </div>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>OAB</th>
                <th>Cadastro</th>
                <th>Último login</th>
                <th>Processos</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="adv-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- CÓDIGOS -->
      <section id="tab-codigos" class="adm-panel" style="display:none;">
        <div class="adm-panel-header">
          <h2>Códigos de convite</h2>
          <button class="adm-btn-primary" onclick="abrirGerarCodigo()"><i class="ti ti-plus"></i> Gerar código</button>
        </div>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Usos</th>
                <th>Status</th>
                <th>Criado em</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cod-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- ADMINS -->
      <section id="tab-admins" class="adm-panel" style="display:none;">
        <div class="adm-panel-header">
          <h2>Administradores</h2>
        </div>
        <div class="adm-promote-box">
          <input type="email" id="admin-email-input" placeholder="Email do usuário a promover">
          <button class="adm-btn-primary" onclick="promoverAdmin()"><i class="ti ti-shield-plus"></i> Promover a admin</button>
        </div>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Nível</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="admins-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal gerar código -->
  <div id="modal-gerar-codigo" class="adm-modal-overlay" style="display:none;" onclick="if(event.target===this)fecharGerarCodigo()">
    <div class="adm-modal">
      <h3>Gerar código de convite</h3>
      <label>Descrição (opcional)</label>
      <input type="text" id="cod-descricao" placeholder="Ex: Convite para Dr. João">
      <label>Limite de usos (opcional, em branco = ilimitado)</label>
      <input type="number" id="cod-usos-max" min="1" placeholder="Ex: 1">
      <div class="adm-modal-actions">
        <button class="adm-btn-secondary" onclick="fecharGerarCodigo()">Cancelar</button>
        <button class="adm-btn-primary" onclick="gerarCodigo()">Gerar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
