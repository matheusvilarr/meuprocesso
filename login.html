<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Meu Processo</title>
<link rel="icon" type="image/png" href="img/images/logo.png">
<link rel="apple-touch-icon" href="img/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3763757554812834" crossorigin="anonymous"></script>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="card-top">
      <a href="/" class="logo">
        <img src="img/images/logo.png" alt="Meu Processo">
      </a>
    </div>

    <div class="card-body">

    <!-- Google OAuth -->
    <button class="btn-google" id="btnGoogle" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continuar com Google
    </button>

    <div class="divider-or"><span>ou</span></div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form class="form" id="loginForm" novalidate>

      <div class="field">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
        <div class="error-msg" id="emailError"></div>
      </div>

      <div class="field">
        <div style="position:relative">
          <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Mostrar senha">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="forgot">
        <a href="/esqueci-senha">Esqueceu sua senha?</a>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Entrar</button>

    </form>

    <!-- CADASTRO -->
    <form class="form" id="signupForm" novalidate style="display:none">

      <div class="field">
        <input type="text" id="su-nome" placeholder="Nome completo" autocomplete="name" required>
        <div class="error-msg" id="suNomeError"></div>
      </div>

      <div class="field">
        <input type="email" id="su-email" placeholder="E-mail profissional" autocomplete="email" required>
        <div class="error-msg" id="suEmailError"></div>
      </div>

      <div class="field-row">
        <div class="field field-uf">
          <select id="su-uf" required>
            <option value="">UF</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SE</option><option>SP</option><option>TO</option>
          </select>
        </div>
        <div class="field field-oab-num">
          <input type="text" id="su-oab-num" placeholder="Número da OAB" autocomplete="off" maxlength="10" inputmode="numeric" required>
        </div>
      </div>
      <div class="error-msg" id="suOabError"></div>

      <div class="field">
        <div style="position:relative">
          <input type="password" id="su-password" placeholder="Crie uma senha forte" autocomplete="new-password" required>
          <button type="button" class="toggle-pw" id="togglePwSu" aria-label="Mostrar senha">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="pwStrengthBar">
          <div class="pw-strength-bar" id="pwStrengthFill"></div>
        </div>
        <div class="pw-strength-label" id="pwStrengthLabel"></div>
        <div class="error-msg" id="suPwError"></div>
      </div>

      <button type="submit" class="btn-submit" id="btnSignup">Criar conta gratuita</button>

      <div id="signupSuccess" class="signup-success" style="display:none">
        ✅ Conta criada! Verifique seu e-mail para confirmar o acesso.
      </div>

    </form>

    <div class="links">
      <a href="mailto:contato@meuprocesso.app.br" class="support-link">Entre em contato com o suporte</a>
    </div>

    <div class="divider"></div>

    <p class="terms">
      Ao entrar, você concorda com os
      <a href="#">Termos de Uso</a> e a
      <a href="#">Política de Privacidade</a> do Meu Processo.
    </p>

    </div><!-- card-body -->
  </div>

  <p class="footer-copy">© 2026 · Meu Processo · Versão 0.1</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/login.js"></script>
</body>
</html>
