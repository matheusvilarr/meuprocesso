<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preços — Meu Processo</title>
<meta name="description" content="Nossa página de preços está em atualização. Fale com a gente para saber mais sobre os planos do Meu Processo.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://meuprocesso.app.br/precos">
<link rel="icon" type="image/png" href="/img/images/logo.png">
<link rel="apple-touch-icon" href="/img/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/login.css">
<style>
  .manut-card { text-align: center; padding: 48px 40px; }
  .manut-icon { font-size: 44px; margin-bottom: 16px; }
  .manut-title { font-size: 22px; font-weight: 700; color: #1a2e6b; margin-bottom: 10px; }
  .manut-sub { font-size: 14px; color: #6b7280; line-height: 1.7; margin-bottom: 28px; }
  .manut-email {
    display: inline-flex; align-items: center; gap: 8px;
    background: #f3f4f6; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; color: #1a2e6b; font-weight: 600;
    text-decoration: none; margin-bottom: 20px;
  }
  .manut-email:hover { background: #e5e7eb; }
  .manut-voltar { display: block; font-size: 13px; color: #6b7280; text-decoration: none; }
  .manut-voltar:hover { color: #1a2e6b; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="card-top">
      <a href="/" class="logo">
        <img src="/img/images/logo.png" alt="Meu Processo">
      </a>
    </div>

    <div class="card-body manut-card">
      <div class="manut-icon">🛠️</div>
      <div class="manut-title">Página em atualização</div>
      <p class="manut-sub">
        Estamos ajustando nossos planos e formas de pagamento.<br>
        Fale com a gente para saber mais sobre preços e condições.
      </p>
      <a class="manut-email" href="mailto:contato@meuprocesso.app.br">
        ✉️ contato@meuprocesso.app.br
      </a>
      <a class="manut-voltar" href="/">← Voltar para o início</a>
    </div>
  </div>
  <p class="footer-copy">© 2026 · Meu Processo</p>
</div>

</body>
</html>
